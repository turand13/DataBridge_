<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DataBridge — отчёт о валидации</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
  th { background: #f0f0f0; }
  .ok { color: #1a7f37; }
  .err { color: #b42318; }
</style>
</head>
<body>
<h1>Отчёт о валидации</h1>
<p>Сформирован: 19-11-2026 15:45:37</p>
<ul>
  <li>Всего записей: <b>3</b></li>
  <li>Успешно обработано: <b class="ok">3</b></li>
  <li>Ошибок: <b class="err">0</b></li>
</ul>
<p class="ok">Ошибок нет.</p>
</body>
</html>
